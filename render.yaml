services:
  - type: web
    name: ragify-backend
    env: python
    region: singapore # Change to preferred Render region (e.g. oregon, frankfurt)
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_TLS_INSECURE
        value: "false"
      - key: DOCUMENT_RETENTION_DAYS
        value: "15"
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: SUPABASE_BUCKET
        value: ragify-files
      # Note: Secrets such as MONGODB_URI, GROQ_API_KEY, PINECONE_API_KEY, 
      # SUPABASE_SERVICE_ROLE_KEY, FIREBASE_PRIVATE_KEY, and FRONTEND_URL 
      # MUST be added manually via the Render Dashboard.
